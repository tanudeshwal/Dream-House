<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan My House | Dream House</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="planner-bg">
<nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand fw-bold text-success" href="../index.html">🏠 Dream House</a><a href="../index.html" class="btn btn-outline-success">Home</a></div></nav>
<div class="container py-5">
<div class="text-center mb-4"><h1 class="fw-bold">Plan My House</h1><p class="text-muted">Enter your requirements and generate a preliminary budget-friendly plan.</p></div>
<div class="form-card p-4 p-md-5">
<form id="plannerForm">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Plot Length (ft)</label><input id="length" type="number" class="form-control" min="10" required placeholder="e.g. 34"></div>
<div class="col-md-6"><label class="form-label">Plot Width (ft)</label><input id="width" type="number" class="form-control" min="10" required placeholder="e.g. 37"></div>
<div class="col-md-6"><label class="form-label">Budget (₹)</label><input id="budget" type="number" class="form-control" min="100000" required placeholder="e.g. 700000"></div>
<div class="col-md-6"><label class="form-label">Family Members</label><input id="family" type="number" class="form-control" min="1" max="20" value="4" required></div>
<div class="col-md-4"><label class="form-label">Bedrooms</label><select id="bedrooms" class="form-select"><option>1</option><option selected>2</option><option>3</option></select></div>
<div class="col-md-4"><label class="form-label">Bathrooms</label><select id="bathrooms" class="form-select"><option selected>1</option><option>2</option><option>3</option></select></div>
<div class="col-md-4"><label class="form-label">House Type</label><select id="houseType" class="form-select"><option>Budget</option><option>Standard</option><option>Future Expansion</option></select></div>
<div class="col-12"><label class="form-label">Location (optional)</label><input id="location" class="form-control" placeholder="e.g. Panipat, Haryana"></div>
<div class="col-12 text-center mt-4"><button class="btn btn-success btn-lg px-5">Generate My Dream House</button></div>
</div>
</form>
</div>
<div id="result" class="mt-5"></div>
</div>
<script src="../js/planner.js"></script>
</body>
</html>
